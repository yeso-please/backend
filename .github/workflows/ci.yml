name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Reject changes to existing Flyway migrations
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only --diff-filter=MD --no-renames "$BASE_SHA" "$HEAD_SHA" -- src/main/resources/db/migration)"
          if [[ -n "$changed" ]]; then
            echo "기존 Flyway migration은 수정/삭제할 수 없습니다:"
            echo "$changed"
            exit 1
          fi
      - name: Compile and test
        run: ./gradlew compileJava test --no-daemon
