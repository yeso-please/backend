# TriPin 로컬 개발 스택: AI 임베딩 서버 + Spring backend + 테스트 프론트.
# 필요한 것: Docker Desktop, backend와 같은 상위 폴더에 clone한 ai 저장소(TRIPIN_AI_DIR로 변경 가능), backend/.env.
#
#   docker compose -f compose.dev.yaml up -d --build                                   # 개발 RDS(dev-rds)
#   docker compose -f compose.dev.yaml -f compose.dev.local-db.yaml up -d --build      # Docker PostgreSQL(local)
#   docker compose -f compose.dev.yaml down
#
# 브라우저: http://127.0.0.1:5173 (backend 8080, AI 8000도 이 컴퓨터에서만 열린다)
# dev-rds로 처음 띄우면 Spring Flyway가 공용 개발 RDS에 pending migration을 적용한다. 먼저 RDS 버전을 확인한다.
name: tripin-dev

services:
  ai:
    build:
      context: ${TRIPIN_AI_DIR:-../ai}
    ports:
      - "127.0.0.1:8000:8000"
    # 개발 RDS는 E5 768차원/템플릿3을 사용한다. 체크포인트 전체 폴더는 Git 밖에서 전달한다.
    volumes:
      - ${TRIPIN_E5_MODEL_DIR:-${TRIPIN_MODEL_DIR:-../ai/data/interim/models/e5-base-rating-2022-2023-t4-all-v2/final}}:/models/final:ro
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_NAME: /models/final
      MODEL_VERSION: e5-base-rating-2022-2023-t4-all-v2
      MODEL_INPUT_FORMAT: e5
      TEMPLATE_VERSIONS: "3"
      MAX_BATCH_ITEMS: "8"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert d['status']=='UP' and d['dimension']==768 and d['modelVersion']=='e5-base-rating-2022-2023-t4-all-v2' and d['templateVersions']==[3]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  backend:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    # 값은 backend/.env(compose가 자동으로 읽음) 또는 셸 환경변수에서 온다. 이미지에는 들어가지 않는다.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev-rds}
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-tripin_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      FLYWAY_USER: ${FLYWAY_USER:-tripin_migrator}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      COURSE_RESTAURANT_SELECTION_SECRET: ${COURSE_RESTAURANT_SELECTION_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_LOGIN_CLIENT_ID: ${KAKAO_LOGIN_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ALLOWED_REDIRECT_URIS: ${KAKAO_ALLOWED_REDIRECT_URIS:-}
      # 여행기 사진 S3(docs/runbooks/diary-photo-storage.md). 이 파일만 쓰면 꺼져 있다(AWS 자격 증명을 넘기지 않으므로).
      # 켜려면 .env에 버킷을 넣고 compose.diary-photos.yaml을 함께 쓴다.
      DIARY_PHOTOS_S3_ENABLED: "false"
      DIARY_PHOTOS_S3_BUCKET: ${DIARY_PHOTOS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      EMBEDDING_SERVICE_BASE_URL: http://ai:8000
      EMBEDDING_MODEL_VERSION: e5-base-rating-2022-2023-t4-all-v2
      EMBEDDING_EXPECTED_DIMENSION: "768"
      EMBEDDING_PROFILE_TEMPLATE_VERSION: "3"
      EMBEDDING_ATTRACTION_TEMPLATE_VERSION: "3"
      EMBEDDING_BATCH_SIZE: "8"
      EMBEDDING_TIMEOUT_MILLIS: "120000"
    depends_on:
      ai:
        condition: service_healthy

  frontend:
    build:
      context: ./test_frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
      AI_URL: http://ai:8000
      VITE_KAKAO_LOGIN_CLIENT_ID: ${KAKAO_LOGIN_CLIENT_ID:-${KAKAO_REST_API_KEY:-}}
      # 코스 경로 지도(5-7)용 카카오 지도 JavaScript 키. 카카오 개발자 콘솔에 http://127.0.0.1:5173 도메인이 등록돼 있어야 한다.
      VITE_KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
      VITE_HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
