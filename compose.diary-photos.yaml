# compose.dev.yaml 뒤에 추가. 로컬 개발에서 여행기 사진을 실제 S3에 저장할 때만 쓴다.
#   docker compose -f compose.dev.yaml -f compose.diary-photos.yaml up -d --build
# 내 AWS 프로필(~/.aws)을 읽기 전용으로 backend 컨테이너에 연결한다. 키를 .env나 이미지에 넣지 않는다.
# 프로필에는 사진 버킷의 diaries/* 읽기·쓰기·삭제 권한만 있으면 된다(런북 참고). 배포 서버는 이 파일 대신 서버 역할을 쓴다.
services:
  backend:
    environment:
      DIARY_PHOTOS_S3_ENABLED: "true"
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    volumes:
      - ${AWS_CONFIG_DIR:-${USERPROFILE:-${HOME}}/.aws}:/aws:ro
