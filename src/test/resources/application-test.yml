# IntegrationTest(@ActiveProfiles("test")) 전용 설정. 테스트 클래스에 @TestPropertySource를 붙이지 말고 여기에 둔다.
jwt:
  secret: test-only-secret-not-used-outside-automated-tests

embedding:
  # 테스트는 가짜 임베딩 클라이언트를 쓴다. 버전 값은 테스트 데이터와 맞추려고 고정한다.
  model-version: mminilm-l12-v1
  # 30초마다 도는 재시도 sweeper는 테스트 데이터·매 테스트 후 TRUNCATE와 경합한다. 테스트에서는 끈다.
  retry-sweep-enabled: false

course:
  restaurant:
    # 테스트 전용 서명 키(32 byte 이상). 운영에서 쓰지 않는다.
    selection-secret: test-only-restaurant-selection-secret-0123456789
