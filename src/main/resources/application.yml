spring:
  config:
    import: "optional:file:./config/application-secret.yaml"
  application:
    name: yeso-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    default-schema: app
    validate-migration-naming: true
    clean-disabled: true

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ----- JWT -----
# secret 은 여기 값을 안 둔다 — 커밋된 기본값이 있으면 실제 배포에서 이 값이 누락됐을 때
# "동작은 하되 누구나 위조 가능한 서명 키"로 조용히 fallback하는 게 가장 위험하다.
# 반드시 ./config/application-secret.yaml(gitignore됨) 또는 환경변수 JWT_SECRET 로 주입하고,
# JwtProperties(config 패키지)가 비어 있으면 기동을 막는다(로컬 개발용 예시 값은
# config/application-secret.example.yaml 참고).
jwt:
  secret: ""
  access-token-ttl-minutes: 30
  refresh-token-ttl-days: 14
