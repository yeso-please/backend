spring:
  config:
    import: "optional:file:./config/application-secret.yaml"
  application:
    name: yeso-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    default-schema: app
    validate-migration-naming: true
    clean-disabled: true

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ----- JWT -----
# secret 은 여기 값을 안 둔다 — 커밋된 기본값이 있으면 실제 배포에서 이 값이 누락됐을 때
# "동작은 하되 누구나 위조 가능한 서명 키"로 조용히 fallback하는 게 가장 위험하다.
# 반드시 ./config/application-secret.yaml(gitignore됨) 또는 환경변수 JWT_SECRET 로 주입하고,
# JwtProperties(config 패키지)가 비어 있으면 기동을 막는다(로컬 개발용 예시 값은
# config/application-secret.example.yaml 참고).
jwt:
  secret: ""
  access-token-ttl-minutes: 30
  refresh-token-ttl-days: 14

# refresh_token cookie의 Secure 속성 — HTTPS로 서빙되는 환경(운영/dev-rds)만 true다.
# local profile은 HTTP이므로 application-local.yml에서 false로 override한다.
app:
  auth:
    cookie-secure: true

# ----- 카카오 로그인(docs/api/auth.md 1-6) -----
# client-id는 KAKAO_LOGIN_CLIENT_ID(로그인용 앱의 REST API 키)가 없으면 식당 검색 키를 쓴다. client-secret은 커밋하지 않는다.
# allowed-redirect-uris는 쉼표로 구분하고 카카오 콘솔의 Redirect URI와 정확히 같아야 한다. 운영은 HTTPS만 넣는다.
# 비어 있어도 기동은 되고, 카카오 로그인 요청만 503 AUTH_KAKAO_NOT_CONFIGURED다.
auth:
  kakao:
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    client-id: ${KAKAO_LOGIN_CLIENT_ID:${course.restaurant.kakao.rest-api-key:}}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:}
    connect-timeout-millis: 2000
    timeout-millis: 3000

# ----- 온보딩 임베딩(Python) -----
# base-url이 비어 있으면 호출이 항상 실패해 job이 PENDING/FAILED로 남는다 — submission 자체는
# 항상 성공한다(작업서: "실패해도 submission과 onboarding 완료를 되돌리지 않는다").
# ----- 개인화 순위 모델(docs/design/recommendation.md §5) -----
# ai scripts/lgbm_ranker.py가 내보낸 ranker.json 경로. 비어 있거나 파일이 없거나 E5 버전이 다르면 꺼지고 코사인 유사도를 쓴다.
ranker:
  model-path: ${RANKER_MODEL_PATH:}
  # 발행한 여행기를 코스 추천에 반영(docs/design/recommendation.md §5). weight 0이면 끈다.
  # 오프라인에서 이득이 확인되지 않아 회원 절반만 무작위로 적용하고, 노출 기록의 ranker_version으로 두 집단을 비교한다.
  diary-feedback:
    weight: ${RANKER_DIARY_FEEDBACK_WEIGHT:0.1}
    treatment-share: ${RANKER_DIARY_FEEDBACK_TREATMENT_SHARE:0.5}

embedding:
  base-url: ${EMBEDDING_SERVICE_BASE_URL:}
  model-version: ${EMBEDDING_MODEL_VERSION:mminilm-l12-ft-b64-v2}
  expected-dimension: ${EMBEDDING_EXPECTED_DIMENSION:384}
  profile-template-version: ${EMBEDDING_PROFILE_TEMPLATE_VERSION:2}
  attraction-batch:
    enabled: false
    batch-size: ${EMBEDDING_BATCH_SIZE:64}
    template-version: ${EMBEDDING_ATTRACTION_TEMPLATE_VERSION:2}
  timeout-millis: ${EMBEDDING_TIMEOUT_MILLIS:5000}
  max-attempts: 5
  retry-backoff-seconds: 30
  retry-sweep-enabled: true
  retry-sweep-interval-ms: 30000

# ----- 식당 추천·검색·선택(docs/api/trip.md 5-3·5-5·5-6) -----
# 비밀값은 커밋하지 않는다. ./config/application-secret.yaml 또는 환경변수로 넣는다.
# 비어 있어도 기동은 되고, 식당 선택 토큰 발급·검증과 카카오 검색만 실패한다.
course:
  restaurant:
    selection-secret: ${COURSE_RESTAURANT_SELECTION_SECRET:}
    kakao:
      base-url: https://dapi.kakao.com
      rest-api-key: ${KAKAO_REST_API_KEY:}
      timeout-millis: 3000
      default-retry-after-seconds: 60
  # 코스 경로(docs/api/trip.md 5-7). 카카오모빌리티 자동차 길찾기, 키는 위 kakao.rest-api-key를 함께 쓴다.
  route:
    base-url: https://apis-navi.kakaomobility.com
    timeout-millis: 2000
    total-budget-millis: 4000
    cache-ttl-minutes: 1440
    cache-max-entries: 5000

# 여행기 사진은 private S3 bucket을 사용한다. 로컬에서는 비활성이고 업로드 요청은 503이다.
# dev 배포는 DIARY_PHOTOS_S3_ENABLED=true, DIARY_PHOTOS_S3_BUCKET, AWS_REGION과 task role 권한을 제공한다.
tripin:
  diary:
    photos:
      enabled: ${DIARY_PHOTOS_S3_ENABLED:false}
      bucket: ${DIARY_PHOTOS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
