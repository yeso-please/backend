spring:
  config:
    import: "optional:file:./config/application-secret.yaml"
  application:
    name: yeso-backend

  # ----- DataSource (SQLite 파일 하나) -----
  datasource:
    url: jdbc:sqlite:./data/yeso.db
    driver-class-name: org.sqlite.JDBC

  # ----- JPA / Hibernate -----
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# ----- JWT -----
# secret 은 커밋하지 않는다. ./config/application-secret.yaml 또는 환경변수 JWT_SECRET 로 주입.
jwt:
  secret: "CHANGE_ME_LOCAL_ONLY_DO_NOT_USE_IN_PROD"
  access-token-ttl-minutes: 30
  refresh-token-ttl-days: 14

# ----- 소셜 로그인 -----
# 프론트가 인가코드를 백엔드로 전달하면, 백엔드가 토큰 교환 후 자체 JWT 발급 (API-DESIGN-DRAFT §1).
# client-secret 은 커밋하지 않는다.
oauth:
  kakao:
    client-id: ""
    client-secret: ""
    redirect-uri: "http://localhost:8080/api/auth/social/kakao/callback"
  google:
    client-id: ""
    client-secret: ""
    redirect-uri: "http://localhost:8080/api/auth/social/google/callback"

# ----- 임베딩 (Ollama 로컬) -----
# API-DESIGN-DRAFT §1/§3 — 외부 API 과금 없이 로컬에서 무료로 임베딩 생성.
embedding:
  ollama:
    base-url: "http://localhost:11434"
    model: "bge-m3"
  # 텍스트 합성 규칙(§3.1) 버전 — 규칙 변경 시 올리면 전체 관광지 embedding_status 를 PENDING 으로 리셋한다.
  template-version: 1
