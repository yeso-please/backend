plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yeso'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	demoMigration {
		java.srcDir 'src/demoMigration/java'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	demoMigrationImplementation.extendsFrom implementation
	demoMigrationRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.48.0')
	implementation 'software.amazon.awssdk:s3'
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	implementation 'org.sejda.imageio:webp-imageio:0.1.6'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT 발급/검증 (access+refresh)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation sourceSets.demoMigration.output
	testImplementation 'com.h2database:h2:2.4.240'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	demoMigrationImplementation 'com.h2database:h2:2.4.240'
	demoMigrationRuntimeOnly 'org.postgresql:postgresql'
}

tasks.register('demoMigration', JavaExec) {
	group = 'migration'
	description = 'Read-only H2 TourAPI migration to PostgreSQL'
	dependsOn tasks.named('demoMigrationClasses')
	classpath = sourceSets.demoMigration.runtimeClasspath
	mainClass = 'com.yeso.backend.migration.DemoMigration'
	workingDir = projectDir
	standardInput = System.in
	environment loadLocalIngestionEnv()
	if (System.getenv('DB_URL')) {
		environment 'DB_URL', System.getenv('DB_URL')
	}
}

tasks.register('tourApiDetailBackfill', JavaExec) {
	group = 'migration'
	description = 'Dry-run or apply missing TourAPI attraction/course descriptions to PostgreSQL'
	dependsOn tasks.named('demoMigrationClasses')
	classpath = sourceSets.demoMigration.runtimeClasspath
	mainClass = 'com.yeso.backend.migration.TourApiDetailBackfill'
	workingDir = projectDir
	standardInput = System.in
	environment loadLocalIngestionEnv()
}

tasks.register('summaryBackfill', JavaExec) {
	group = 'migration'
	description = 'Dry-run, generate, export, or import reviewed region/attraction one-line summaries and tags (#89)'
	dependsOn tasks.named('demoMigrationClasses')
	classpath = sourceSets.demoMigration.runtimeClasspath
	mainClass = 'com.yeso.backend.migration.SummaryBackfill'
	workingDir = projectDir
	environment loadLocalIngestionEnv()
}

/** Load only known local ingestion settings; process environment always wins over .env. */
def loadLocalIngestionEnv() {
	def allowed = ['DB_URL', 'DB_USERNAME', 'DB_PASSWORD', 'TOUR_API_KEY', 'TOUR_API_BASE_URL',
			'INGESTION_ACTOR', 'EMBEDDING_SERVICE_BASE_URL', 'MIGRATION_TARGET_ENV', 'MIGRATION_BEFORE_SNAPSHOT', 'MIGRATION_CONFIRM_RUN_ID'] as Set
	def values = [:]
	def envFile = file('.env')
	if (envFile.isFile()) {
		envFile.eachLine('UTF-8') { line ->
			def text = line.trim()
			if (!text || text.startsWith('#')) return
			def separator = text.indexOf('=')
			if (separator <= 0) return
			def key = text.substring(0, separator).trim()
			if (!allowed.contains(key) || System.getenv(key) != null) return
			def value = text.substring(separator + 1).trim()
			if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
				value = value.substring(1, value.length() - 1)
			}
			values[key] = value
		}
	}
	return values
}

['rdsMigrationInfo': 'info', 'rdsMigrationValidate': 'validate', 'rdsMigrate': 'migrate'].each { taskName, command ->
	tasks.register(taskName, JavaExec) {
		group = 'migration'
		description = "Run guarded ${command} against the development RDS only"
		classpath = sourceSets.main.runtimeClasspath
		mainClass = 'com.yeso.backend.migration.RdsMigration'
		args command
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
