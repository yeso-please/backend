services:
  postgres:
    image: postgres:17-alpine
    container_name: tripin-local-postgres
    environment:
      POSTGRES_DB: tripin_local
      POSTGRES_USER: tripin_local
      POSTGRES_PASSWORD: tripin_local_dev_only
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripin_local -d tripin_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - tripin-postgres-data:/var/lib/postgresql/data

volumes:
  tripin-postgres-data:
